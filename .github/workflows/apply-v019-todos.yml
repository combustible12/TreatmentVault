name: Apply TreatmentVault 0.19.0 todo center

on:
  push:
    paths:
      - '.github/workflows/apply-v019-todos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply todo center changes
        run: |
          python3 .github/scripts/apply_v019_todos.py
          python3 .github/scripts/apply_v019_scrolltop.py
      - name: Run regression tests and compile
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No app changes to commit."
            exit 0
          fi
          git commit -m "TreatmentVault 0.19.0: add todo center and quick scroll-to-top"
          git push origin HEAD:main
