name: Fix 0.28.0 TextButtons

on:
  push:
    branches:
      - feature/note-media-v0280

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/note-media-v0280
      - name: Fix viewer TextButton arguments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt')
          text = p.read_text(encoding='utf-8')
          replacements = {
            'TextButton(Modifier.weight(1f), onClick = { rotateBy(-1) })': 'TextButton(onClick = { rotateBy(-1) }, modifier = Modifier.weight(1f))',
            'TextButton(Modifier.weight(1f), onClick = { rotateBy(1) })': 'TextButton(onClick = { rotateBy(1) }, modifier = Modifier.weight(1f))',
            'TextButton(Modifier.weight(1f), onClick = { resetView() })': 'TextButton(onClick = { resetView() }, modifier = Modifier.weight(1f))',
            'TextButton(Modifier.weight(1f), onClick = { quarterTurns = 0; resetView() })': 'TextButton(onClick = { quarterTurns = 0; resetView() }, modifier = Modifier.weight(1f))',
            'TextButton(Modifier.weight(1f), onClick = { editing = true })': 'TextButton(onClick = { editing = true }, modifier = Modifier.weight(1f))',
            'TextButton(Modifier.weight(1f), onClick = { moveGallery(-1) })': 'TextButton(onClick = { moveGallery(-1) }, modifier = Modifier.weight(1f))',
            'TextButton(Modifier.weight(1f), onClick = { moveGallery(1) })': 'TextButton(onClick = { moveGallery(1) }, modifier = Modifier.weight(1f))',
          }
          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected 1 match for {old}, found {count}')
            text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt
          git commit -m "Fix image viewer TextButton arguments"
          git push origin HEAD:feature/note-media-v0280
