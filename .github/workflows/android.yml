name: Android APK
# Builds with one explicit repository keystore and publishes only after signature verification.
on:
  push:
  workflow_dispatch:

concurrency:
  group: treatmentvault-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Restore canonical signing key
        run: |
          base64 --decode .github/keystore/treatmentvault-debug.keystore.b64 > .github/keystore/treatmentvault-debug.keystore
          chmod 600 .github/keystore/treatmentvault-debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Verify install package and signing identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          KEYSTORE=".github/keystore/treatmentvault-debug.keystore"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/debug/apk-signing.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee app/build/outputs/apk/debug/apk-info.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          KEY_SHA="$(keytool -exportcert -alias androiddebugkey -keystore "$KEYSTORE" -storepass android 2>/dev/null | sha256sum | awk '{print $1}')"
          APK_SHA="$(awk -F': ' '/certificate SHA-256 digest:/{print tolower($NF); exit}' app/build/outputs/apk/debug/apk-signing.txt)"
          echo "Expected signer: $KEY_SHA"
          echo "APK signer:      $APK_SHA"
          test -n "$KEY_SHA" && test "$KEY_SHA" = "$APK_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: TreatmentVault-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-info.txt
            app/build/outputs/apk/debug/apk-signing.txt
      - name: Publish verified APK to update channel
        env:
          UPDATE_REPO_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        if: ${{ env.UPDATE_REPO_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          VERSION_CODE="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)"
          VERSION_NAME="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          AUTH="$(printf 'x-access-token:%s' "$UPDATE_REPO_TOKEN" | base64 -w0)"
          export VERSION_CODE VERSION_NAME SHA

          for ATTEMPT in 1 2 3; do
            rm -rf update-repo
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" clone https://github.com/combustible12/TreatmentVault-Updates.git update-repo

            REMOTE_CODE="$(python3 - <<'PY'
          import json
          try:
              with open('update-repo/update.json', encoding='utf-8') as f:
                  print(int(json.load(f).get('versionCode', 0)))
          except Exception:
              print(0)
          PY
          )"
            if [ "$REMOTE_CODE" -gt "$VERSION_CODE" ]; then
              echo "Update channel already has newer versionCode=$REMOTE_CODE; skipping older build $VERSION_CODE."
              exit 0
            fi

            cp "$APK" update-repo/TreatmentVault-latest.apk
            python3 - <<'PY'
          import json, os
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": "https://raw.githubusercontent.com/combustible12/TreatmentVault-Updates/main/TreatmentVault-latest.apk",
              "sha256": os.environ["SHA"],
              "notes": "修复再次打开记录时正文看起来消失的问题：富文本编辑器现在会在数据库记录异步加载完成后正确恢复文字与图片区块，同时避免用户输入时被重复重置。此修复作用于普通笔记以及共用该编辑器的检查、治疗等记录；不改数据库结构。"
          }
          with open("update-repo/update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
            cd update-repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TreatmentVault-latest.apk update.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish TreatmentVault ${VERSION_NAME}"
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push; then
              exit 0
            fi
            cd ..
            echo "Publish conflict on attempt $ATTEMPT; retrying from latest update-channel head."
            sleep $((ATTEMPT * 2))
          done

          echo "Failed to publish after retries."
          exit 1
