name: Apply TreatmentVault 0.22.0 image viewer

on:
  push:
    paths:
      - '.github/workflows/apply-v022-image-viewer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore canonical signing key
        run: |
          base64 --decode .github/keystore/treatmentvault-debug.keystore.b64 > .github/keystore/treatmentvault-debug.keystore
          chmod 600 .github/keystore/treatmentvault-debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply image viewer changes
        run: python3 .github/scripts/apply_v022_image_viewer.py
      - name: Run regression tests and compile
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No app changes to commit."
            exit 0
          fi
          git commit -m "TreatmentVault 0.22.0: improve image viewer"
          git push origin HEAD:main
