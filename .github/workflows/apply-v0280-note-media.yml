name: Apply 0.28.0 Note Media

on:
  push:
    branches:
      - feature/note-media-v0280

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/note-media-v0280
      - name: Apply 0.28.0 note media patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('app/src/main/java/com/menter/treatmentvault/data/CategoryModels.kt', '''    val tags: String = "",\n    val updatedAt: Long = System.currentTimeMillis(),\n)\n''', '''    val tags: String = "",\n    val createdAt: Long = System.currentTimeMillis(),\n    val updatedAt: Long = System.currentTimeMillis(),\n)\n''')

          db = Path('app/src/main/java/com/menter/treatmentvault/data/AppDatabase.kt')
          text = db.read_text(encoding='utf-8').replace('    version = 8,', '    version = 9,', 1)
          anchor = '''        private val MIGRATION_7_8 = object : Migration(7, 8) {\n            override fun migrate(db: SupportSQLiteDatabase) {\n                db.execSQL("ALTER TABLE `RecordStateEntity` ADD COLUMN `customTitle` TEXT")\n            }\n        }\n'''
          insert = anchor + '''\n        private val MIGRATION_8_9 = object : Migration(8, 9) {\n            override fun migrate(db: SupportSQLiteDatabase) {\n                db.execSQL("ALTER TABLE `CustomEntryEntity` ADD COLUMN `createdAt` INTEGER NOT NULL DEFAULT 0")\n                db.execSQL("UPDATE `CustomEntryEntity` SET `createdAt`=`updatedAt` WHERE `createdAt`=0")\n            }\n        }\n'''
          if text.count(anchor) != 1: raise SystemExit('AppDatabase migration anchor mismatch')
          text = text.replace(anchor, insert, 1)
          old_create = '''            db.execSQL("CREATE TABLE IF NOT EXISTS `CustomEntryEntity` (`id` INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL, `categoryId` TEXT NOT NULL, `date` TEXT NOT NULL, `title` TEXT NOT NULL, `content` TEXT NOT NULL, `tags` TEXT NOT NULL, `updatedAt` INTEGER NOT NULL)")\n'''
          new_create = '''            db.execSQL("CREATE TABLE IF NOT EXISTS `CustomEntryEntity` (`id` INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL, `categoryId` TEXT NOT NULL, `date` TEXT NOT NULL, `title` TEXT NOT NULL, `content` TEXT NOT NULL, `tags` TEXT NOT NULL, `createdAt` INTEGER NOT NULL, `updatedAt` INTEGER NOT NULL)")\n'''
          if text.count(old_create) != 1: raise SystemExit('CustomEntry create sql mismatch')
          text = text.replace(old_create, new_create, 1)
          text = text.replace('MIGRATION_6_7, MIGRATION_7_8)', 'MIGRATION_6_7, MIGRATION_7_8, MIGRATION_8_9)', 1)
          db.write_text(text, encoding='utf-8')

          replace_once('app/src/main/java/com/menter/treatmentvault/backup/BackupManager.kt', '''            snap.customEntries?.let { list -> dao.clearCustomEntries(); list.forEach { dao.saveCustomEntry(it) } }\n''', '''            snap.customEntries?.let { list ->\n                dao.clearCustomEntries()\n                list.forEach { entry -> dao.saveCustomEntry(if (entry.createdAt > 0L) entry else entry.copy(createdAt = entry.updatedAt)) }\n            }\n''')

          notes = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/NotesScreen.kt')
          text = notes.read_text(encoding='utf-8')
          old = '''    var categoryId by rememberSaveable(noteId, initialCategoryId) { mutableStateOf(initialCategoryId.orEmpty()) }\n'''
          new = old + '''    var createdAtMs by rememberSaveable(noteId) { mutableLongStateOf(System.currentTimeMillis()) }\n    var lastSavedAtMs by rememberSaveable(noteId) { mutableLongStateOf(0L) }\n'''
          if text.count(old) != 1: raise SystemExit('Notes state anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''            categoryId = note.categoryId\n            pendingFiles = emptyList()\n'''
          new = '''            categoryId = note.categoryId\n            createdAtMs = note.createdAt.takeIf { it > 0L } ?: note.updatedAt\n            lastSavedAtMs = note.updatedAt\n            pendingFiles = emptyList()\n'''
          if text.count(old) != 1: raise SystemExit('Notes hydrate anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''            tags = tags.trim(),\n            updatedAt = System.currentTimeMillis(),\n        )\n'''
          new = '''            tags = tags.trim(),\n            createdAt = createdAtMs,\n            updatedAt = System.currentTimeMillis(),\n        )\n'''
          if text.count(old) != 1: raise SystemExit('Notes value anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''            persistedId = savedId\n            reconcileRichAttachments(context, dao, "note", savedId, value.content, removedSnapshot)\n'''
          new = '''            persistedId = savedId\n            lastSavedAtMs = value.updatedAt\n            reconcileRichAttachments(context, dao, "note", savedId, value.content, removedSnapshot)\n'''
          if text.count(old) != 1: raise SystemExit('Notes saved anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''                item {\n                    Text(\n                        when {\n'''
          new = '''                item {\n                    if (persistedId > 0L) {\n                        val timeFormat = remember { SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()) }\n                        Column(verticalArrangement = Arrangement.spacedBy(2.dp)) {\n                            Text("创建时间：${timeFormat.format(Date(createdAtMs))}", style = MaterialTheme.typography.labelSmall)\n                            val modified = lastSavedAtMs.takeIf { it > 0L } ?: createdAtMs\n                            Text("最后修改：${timeFormat.format(Date(modified))}", style = MaterialTheme.typography.labelSmall)\n                        }\n                    }\n                }\n                item {\n                    Text(\n                        when {\n'''
          if text.count(old) != 1: raise SystemExit('Notes footer anchor mismatch')
          text = text.replace(old, new, 1)
          notes.write_text(text, encoding='utf-8')

          grid = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/NoteImageGrid.kt')
          text = grid.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.material.icons.filled.BrokenImage\n', 'import androidx.compose.material.icons.filled.ArrowBack\nimport androidx.compose.material.icons.filled.ArrowForward\nimport androidx.compose.material.icons.filled.BrokenImage\n', 1)
          old = '''    onOpen: (File) -> Unit,\n    onDelete: (Int, RichBlock.ImageBlock) -> Unit,\n) {\n'''
          new = '''    onOpen: (File) -> Unit,\n    onDelete: (Int, RichBlock.ImageBlock) -> Unit,\n    onMove: (Int, Int) -> Unit,\n) {\n'''
          if text.count(old) != 1: raise SystemExit('Grid signature anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''                                FilledIconButton(\n                                    onClick = { onDelete(image.index, image.block) },\n                                    modifier = Modifier.align(Alignment.TopEnd).padding(4.dp).size(34.dp),\n                                    colors = IconButtonDefaults.filledIconButtonColors(\n                                        containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.78f),\n                                        contentColor = MaterialTheme.colorScheme.onSurface,\n                                    ),\n                                ) {\n                                    Icon(Icons.Default.DeleteOutline, contentDescription = "删除图片", modifier = Modifier.size(18.dp))\n                                }\n'''
          new = old + '''                                Row(modifier = Modifier.align(Alignment.BottomStart).padding(4.dp), horizontalArrangement = Arrangement.spacedBy(2.dp)) {\n                                    val localIndex = images.indexOf(image)\n                                    FilledIconButton(onClick = { onMove(image.index, -1) }, enabled = localIndex > 0, modifier = Modifier.size(32.dp)) { Icon(Icons.Default.ArrowBack, "图片前移", modifier = Modifier.size(17.dp)) }\n                                    FilledIconButton(onClick = { onMove(image.index, 1) }, enabled = localIndex in 0 until images.lastIndex, modifier = Modifier.size(32.dp)) { Icon(Icons.Default.ArrowForward, "图片后移", modifier = Modifier.size(17.dp)) }\n                                }\n'''
          if text.count(old) != 1: raise SystemExit('Grid overlay anchor mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('"${images.size} 张图片 · 自动宫格显示，点图片查看原图"', '"${images.size} 张图片 · 可调整顺序 · 点图片查看/编辑，并可继续滑看其他照片"', 1)
          grid.write_text(text, encoding='utf-8')

          editor = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt')
          text = editor.read_text(encoding='utf-8')
          old = '''    var previewFile by remember(ownerType, sessionKey) { mutableStateOf<File?>(null) }\n'''
          if text.count(old) != 1: raise SystemExit('Preview state anchor mismatch')
          text = text.replace(old, '''    var previewImageName by remember(ownerType, sessionKey) { mutableStateOf<String?>(null) }\n''', 1)
          old = '''                    AutomaticNoteImageGrid(\n                        images = imageItems,\n                        onOpen = { previewFile = it },\n                        onDelete = { imageIndex, imageBlock -> remove(imageIndex, imageBlock) },\n                    )\n'''
          new = '''                    AutomaticNoteImageGrid(\n                        images = imageItems,\n                        onOpen = { previewImageName = it.name },\n                        onDelete = { imageIndex, imageBlock -> remove(imageIndex, imageBlock) },\n                        onMove = { imageIndex, delta -> (blocks.getOrNull(imageIndex) as? RichBlock.ImageBlock)?.let { moveBlock(it, delta) } },\n                    )\n'''
          if text.count(old) != 1: raise SystemExit('Grid call anchor mismatch')
          text = text.replace(old, new, 1)
          start = text.find('    previewFile?.let { file -> GridFullScreenImageViewer')
          if start < 0: raise SystemExit('Viewer tail start not found')
          tail = '''    val galleryFiles = blocks.filterIsInstance<RichBlock.ImageBlock>().map { attachmentFile(context, it.fileName) }.filter { it.isFile }\n    previewImageName?.let { selectedName ->\n        val initialIndex = galleryFiles.indexOfFirst { it.name == selectedName }.coerceAtLeast(0)\n        if (galleryFiles.isNotEmpty()) GridFullScreenImageViewer(galleryFiles, initialIndex) { previewImageName = null }\n    }\n}\n\n@Composable\nprivate fun GridFullScreenImageViewer(files: List<File>, initialIndex: Int, onDismiss: () -> Unit) {\n    var currentIndex by remember(files, initialIndex) { mutableIntStateOf(initialIndex.coerceIn(0, files.lastIndex)) }\n    val file = files[currentIndex]\n    val sourceSize = remember(file.absolutePath, file.lastModified()) { val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }; BitmapFactory.decodeFile(file.absolutePath, o); (o.outWidth.takeIf { it > 0 } ?: 1) to (o.outHeight.takeIf { it > 0 } ?: 1) }\n    var quarterTurns by remember(file.absolutePath) { mutableIntStateOf(0) }\n    var zoom by remember(file.absolutePath) { mutableFloatStateOf(1f) }\n    var pan by remember(file.absolutePath) { mutableStateOf(Offset.Zero) }\n    var swipeAccum by remember(file.absolutePath) { mutableStateOf(Offset.Zero) }\n    var editing by remember(file.absolutePath) { mutableStateOf(false) }\n    var editRevision by remember(file.absolutePath) { mutableIntStateOf(0) }\n    fun resetView() { zoom = 1f; pan = Offset.Zero; swipeAccum = Offset.Zero }\n    fun rotateBy(turns: Int) { quarterTurns = (quarterTurns + turns).mod(4); resetView() }\n    fun moveGallery(delta: Int) { if (files.size > 1) { currentIndex = (currentIndex + delta + files.size) % files.size; quarterTurns = 0; resetView() } }\n    Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {\n        BoxWithConstraints(modifier = Modifier.fillMaxSize().background(Color.Black).pointerInput(file.absolutePath, currentIndex) {\n            detectTransformGestures { _, drag, gestureZoom, _ ->\n                val nextZoom = (zoom * gestureZoom).coerceIn(1f, 6f); zoom = nextZoom\n                if (nextZoom <= 1.001f) { pan = Offset.Zero; swipeAccum += drag; val x = swipeAccum.x; val y = swipeAccum.y; if (kotlin.math.abs(x) > 120f || kotlin.math.abs(y) > 120f) { if (kotlin.math.abs(x) >= kotlin.math.abs(y)) moveGallery(if (x < 0) 1 else -1) else moveGallery(if (y < 0) 1 else -1); swipeAccum = Offset.Zero } } else pan += drag\n            }\n        }.pointerInput(file.absolutePath) { detectTapGestures(onDoubleTap = { resetView() }) }, contentAlignment = Alignment.Center) {\n            val sw = sourceSize.first.toFloat(); val sh = sourceSize.second.toFloat(); val rotated = quarterTurns % 2 != 0; val fit = minOf(maxWidth.value / if (rotated) sh else sw, maxHeight.value / if (rotated) sw else sh)\n            key(file.absolutePath, editRevision) { AsyncImage(model = file, contentDescription = "高清原图", modifier = Modifier.size((sw * fit).dp, (sh * fit).dp).graphicsLayer { rotationZ = quarterTurns * 90f; scaleX = zoom; scaleY = zoom; translationX = pan.x; translationY = pan.y }, contentScale = ContentScale.FillBounds) }\n            FilledIconButton(onClick = onDismiss, modifier = Modifier.align(Alignment.TopEnd).statusBarsPadding().padding(16.dp), colors = IconButtonDefaults.filledIconButtonColors(containerColor = Color(0xAA2A2A2A), contentColor = Color.White)) { Icon(Icons.Default.Close, "关闭高清原图") }\n            if (files.size > 1) Surface(modifier = Modifier.align(Alignment.TopCenter).statusBarsPadding().padding(top = 18.dp), color = Color(0x99222222), contentColor = Color.White, shape = MaterialTheme.shapes.large) { Text("${currentIndex + 1} / ${files.size} · 左右或上下滑动", Modifier.padding(horizontal = 12.dp, vertical = 6.dp)) }\n            Surface(modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().windowInsetsPadding(WindowInsets.safeDrawing.only(WindowInsetsSides.Bottom)).padding(start = 12.dp, end = 12.dp, bottom = 48.dp), color = Color(0xCC222222), contentColor = Color.White, shape = MaterialTheme.shapes.extraLarge) {\n                Column(Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 6.dp), verticalArrangement = Arrangement.spacedBy(2.dp)) {\n                    Row(Modifier.fillMaxWidth()) { TextButton(Modifier.weight(1f), onClick = { rotateBy(-1) }) { Text("左转", color = Color.White) }; TextButton(Modifier.weight(1f), onClick = { rotateBy(1) }) { Text("右转", color = Color.White) } }\n                    Row(Modifier.fillMaxWidth()) { TextButton(Modifier.weight(1f), onClick = { resetView() }) { Text("适应", color = Color.White) }; TextButton(Modifier.weight(1f), onClick = { quarterTurns = 0; resetView() }) { Text("重置", color = Color.White) }; TextButton(Modifier.weight(1f), onClick = { editing = true }) { Text("编辑", color = Color.White) } }\n                    if (files.size > 1) Row(Modifier.fillMaxWidth()) { TextButton(Modifier.weight(1f), onClick = { moveGallery(-1) }) { Text("上一张", color = Color.White) }; TextButton(Modifier.weight(1f), onClick = { moveGallery(1) }) { Text("下一张", color = Color.White) } }\n                }\n            }\n        }\n    }\n    if (editing) NoteImageEditorDialog(file, { editing = false }) { editRevision += 1; resetView() }\n}\n'''
          editor.write_text(text[:start] + tail, encoding='utf-8')

          replace_once('app/build.gradle.kts', '''        versionCode = 43\n        versionName = "0.27.1"\n''', '''        versionCode = 44\n        versionName = "0.28.0"\n''')
          PY

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/menter/treatmentvault/data/CategoryModels.kt app/src/main/java/com/menter/treatmentvault/data/AppDatabase.kt app/src/main/java/com/menter/treatmentvault/backup/BackupManager.kt app/src/main/java/com/menter/treatmentvault/ui/screens/NotesScreen.kt app/src/main/java/com/menter/treatmentvault/ui/screens/NoteImageGrid.kt app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt app/build.gradle.kts
          git commit -m "Add note media editing, gallery, ordering and timestamps for 0.28.0"
          git push origin HEAD:feature/note-media-v0280
