name: Apply 0.28.0 Note Media

on:
  push:
    branches:
      - feature/note-media-v0280

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/note-media-v0280
      - name: Apply 0.28.0 note media patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # CustomEntry creation timestamp: additive schema change only.
          replace_once(
              'app/src/main/java/com/menter/treatmentvault/data/CategoryModels.kt',
              '''    val tags: String = "",\n    val updatedAt: Long = System.currentTimeMillis(),\n)\n''',
              '''    val tags: String = "",\n    val createdAt: Long = System.currentTimeMillis(),\n    val updatedAt: Long = System.currentTimeMillis(),\n)\n'''
          )

          db = Path('app/src/main/java/com/menter/treatmentvault/data/AppDatabase.kt')
          text = db.read_text(encoding='utf-8')
          text = text.replace('    version = 8,', '    version = 9,', 1)
          anchor = '''        private val MIGRATION_7_8 = object : Migration(7, 8) {\n            override fun migrate(db: SupportSQLiteDatabase) {\n                db.execSQL("ALTER TABLE `RecordStateEntity` ADD COLUMN `customTitle` TEXT")\n            }\n        }\n'''
          insert = anchor + '''\n        private val MIGRATION_8_9 = object : Migration(8, 9) {\n            override fun migrate(db: SupportSQLiteDatabase) {\n                db.execSQL("ALTER TABLE `CustomEntryEntity` ADD COLUMN `createdAt` INTEGER NOT NULL DEFAULT 0")\n                db.execSQL("UPDATE `CustomEntryEntity` SET `createdAt`=`updatedAt` WHERE `createdAt`=0")\n            }\n        }\n'''
          if text.count(anchor) != 1: raise SystemExit('AppDatabase migration anchor mismatch')
          text = text.replace(anchor, insert, 1)
          old_create = '''            db.execSQL("CREATE TABLE IF NOT EXISTS `CustomEntryEntity` (`id` INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL, `categoryId` TEXT NOT NULL, `date` TEXT NOT NULL, `title` TEXT NOT NULL, `content` TEXT NOT NULL, `tags` TEXT NOT NULL, `updatedAt` INTEGER NOT NULL)")\n'''
          new_create = '''            db.execSQL("CREATE TABLE IF NOT EXISTS `CustomEntryEntity` (`id` INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL, `categoryId` TEXT NOT NULL, `date` TEXT NOT NULL, `title` TEXT NOT NULL, `content` TEXT NOT NULL, `tags` TEXT NOT NULL, `createdAt` INTEGER NOT NULL, `updatedAt` INTEGER NOT NULL)")\n'''
          if text.count(old_create) != 1: raise SystemExit('CustomEntry create sql mismatch')
          text = text.replace(old_create, new_create, 1)
          text = text.replace('MIGRATION_6_7, MIGRATION_7_8)', 'MIGRATION_6_7, MIGRATION_7_8, MIGRATION_8_9)', 1)
          db.write_text(text, encoding='utf-8')

          # Old backups do not contain createdAt; normalize on restore without rejecting them.
          replace_once(
              'app/src/main/java/com/menter/treatmentvault/backup/BackupManager.kt',
              '''            snap.customEntries?.let { list -> dao.clearCustomEntries(); list.forEach { dao.saveCustomEntry(it) } }\n''',
              '''            snap.customEntries?.let { list ->\n                dao.clearCustomEntries()\n                list.forEach { entry ->\n                    dao.saveCustomEntry(if (entry.createdAt > 0L) entry else entry.copy(createdAt = entry.updatedAt))\n                }\n            }\n'''
          )

          # Note editor: preserve createdAt and show precise created/modified time.
          notes = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/NotesScreen.kt')
          text = notes.read_text(encoding='utf-8')
          text = text.replace('import java.text.SimpleDateFormat\n', 'import java.text.SimpleDateFormat\nimport java.text.DateFormat\n', 1)
          old = '''    var categoryId by rememberSaveable(noteId, initialCategoryId) { mutableStateOf(initialCategoryId.orEmpty()) }\n'''
          new = '''    var categoryId by rememberSaveable(noteId, initialCategoryId) { mutableStateOf(initialCategoryId.orEmpty()) }\n    var createdAtMs by rememberSaveable(noteId) { mutableLongStateOf(System.currentTimeMillis()) }\n    var lastSavedAtMs by rememberSaveable(noteId) { mutableLongStateOf(0L) }\n'''
          if text.count(old) != 1: raise SystemExit('Notes state anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''            categoryId = note.categoryId\n            pendingFiles = emptyList()\n'''
          new = '''            categoryId = note.categoryId\n            createdAtMs = note.createdAt.takeIf { it > 0L } ?: note.updatedAt\n            lastSavedAtMs = note.updatedAt\n            pendingFiles = emptyList()\n'''
          if text.count(old) != 1: raise SystemExit('Notes hydrate anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''            tags = tags.trim(),\n            updatedAt = System.currentTimeMillis(),\n        )\n'''
          new = '''            tags = tags.trim(),\n            createdAt = createdAtMs,\n            updatedAt = System.currentTimeMillis(),\n        )\n'''
          if text.count(old) != 1: raise SystemExit('Notes value anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''            persistedId = savedId\n            reconcileRichAttachments(context, dao, "note", savedId, value.content, removedSnapshot)\n'''
          new = '''            persistedId = savedId\n            lastSavedAtMs = value.updatedAt\n            reconcileRichAttachments(context, dao, "note", savedId, value.content, removedSnapshot)\n'''
          if text.count(old) != 1: raise SystemExit('Notes saved anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''                item {\n                    Text(\n                        when {\n'''
          new = '''                item {\n                    if (persistedId > 0L) {\n                        val timeFormat = remember { SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()) }\n                        Column(verticalArrangement = Arrangement.spacedBy(2.dp)) {\n                            Text("创建时间：${timeFormat.format(Date(createdAtMs))}", style = MaterialTheme.typography.labelSmall)\n                            val modified = lastSavedAtMs.takeIf { it > 0L } ?: createdAtMs\n                            Text("最后修改：${timeFormat.format(Date(modified))}", style = MaterialTheme.typography.labelSmall)\n                        }\n                    }\n                }\n                item {\n                    Text(\n                        when {\n'''
          if text.count(old) != 1: raise SystemExit('Notes footer anchor mismatch')
          text = text.replace(old, new, 1)
          notes.write_text(text, encoding='utf-8')

          # Image grid: per-image reorder controls.
          grid = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/NoteImageGrid.kt')
          text = grid.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.material.icons.filled.BrokenImage\n', 'import androidx.compose.material.icons.filled.ArrowBack\nimport androidx.compose.material.icons.filled.ArrowForward\nimport androidx.compose.material.icons.filled.BrokenImage\n', 1)
          old = '''    onOpen: (File) -> Unit,\n    onDelete: (Int, RichBlock.ImageBlock) -> Unit,\n) {\n'''
          new = '''    onOpen: (File) -> Unit,\n    onDelete: (Int, RichBlock.ImageBlock) -> Unit,\n    onMove: (Int, Int) -> Unit,\n) {\n'''
          if text.count(old) != 1: raise SystemExit('Grid signature anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''                                FilledIconButton(\n                                    onClick = { onDelete(image.index, image.block) },\n                                    modifier = Modifier.align(Alignment.TopEnd).padding(4.dp).size(34.dp),\n                                    colors = IconButtonDefaults.filledIconButtonColors(\n                                        containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.78f),\n                                        contentColor = MaterialTheme.colorScheme.onSurface,\n                                    ),\n                                ) {\n                                    Icon(Icons.Default.DeleteOutline, contentDescription = "删除图片", modifier = Modifier.size(18.dp))\n                                }\n'''
          new = old + '''                                Row(\n                                    modifier = Modifier.align(Alignment.BottomStart).padding(4.dp),\n                                    horizontalArrangement = Arrangement.spacedBy(2.dp),\n                                ) {\n                                    val localIndex = images.indexOf(image)\n                                    FilledIconButton(\n                                        onClick = { onMove(image.index, -1) },\n                                        enabled = localIndex > 0,\n                                        modifier = Modifier.size(32.dp),\n                                    ) { Icon(Icons.Default.ArrowBack, contentDescription = "图片前移", modifier = Modifier.size(17.dp)) }\n                                    FilledIconButton(\n                                        onClick = { onMove(image.index, 1) },\n                                        enabled = localIndex in 0 until images.lastIndex,\n                                        modifier = Modifier.size(32.dp),\n                                    ) { Icon(Icons.Default.ArrowForward, contentDescription = "图片后移", modifier = Modifier.size(17.dp)) }\n                                }\n'''
          if text.count(old) != 1: raise SystemExit('Grid overlay anchor mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('"${images.size} 张图片 · 自动宫格显示，点图片查看原图"', '"${images.size} 张图片 · 可调整顺序 · 点图片查看/编辑，并可继续滑看其他照片"', 1)
          grid.write_text(text, encoding='utf-8')

          # Rich editor: gallery navigation across all note images + in-place image editor.
          editor = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt')
          text = editor.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.foundation.gestures.detectTapGestures\n', 'import androidx.compose.foundation.gestures.detectTapGestures\n', 1)
          text = text.replace('import kotlin.math', 'import kotlin.math', 1) if 'import kotlin.math' in text else text
          old = '''    var previewFile by remember(ownerType, sessionKey) { mutableStateOf<File?>(null) }\n'''
          new = '''    var previewImageName by remember(ownerType, sessionKey) { mutableStateOf<String?>(null) }\n'''
          if text.count(old) != 1: raise SystemExit('Preview state anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''                    AutomaticNoteImageGrid(\n                        images = imageItems,\n                        onOpen = { previewFile = it },\n                        onDelete = { imageIndex, imageBlock -> remove(imageIndex, imageBlock) },\n                    )\n'''
          new = '''                    AutomaticNoteImageGrid(\n                        images = imageItems,\n                        onOpen = { previewImageName = it.name },\n                        onDelete = { imageIndex, imageBlock -> remove(imageIndex, imageBlock) },\n                        onMove = { imageIndex, delta ->\n                            val imageBlock = blocks.getOrNull(imageIndex) as? RichBlock.ImageBlock\n                            if (imageBlock != null) moveBlock(imageBlock, delta)\n                        },\n                    )\n'''
          if text.count(old) != 1: raise SystemExit('Grid call anchor mismatch')
          text = text.replace(old, new, 1)
          start = text.find('    previewFile?.let { file -> GridFullScreenImageViewer')
          if start < 0: raise SystemExit('Viewer tail start not found')
          tail = '''    val galleryFiles = blocks.filterIsInstance<RichBlock.ImageBlock>()\n        .map { attachmentFile(context, it.fileName) }\n        .filter { it.isFile }\n    previewImageName?.let { selectedName ->\n        val initialIndex = galleryFiles.indexOfFirst { it.name == selectedName }.coerceAtLeast(0)\n        if (galleryFiles.isNotEmpty()) {\n            GridFullScreenImageViewer(\n                files = galleryFiles,\n                initialIndex = initialIndex,\n                onDismiss = { previewImageName = null },\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun GridFullScreenImageViewer(\n    files: List<File>,\n    initialIndex: Int,\n    onDismiss: () -> Unit,\n) {\n    var currentIndex by remember(files, initialIndex) { mutableIntStateOf(initialIndex.coerceIn(0, files.lastIndex)) }\n    val file = files[currentIndex]\n    val sourceSize = remember(file.absolutePath, file.lastModified()) {\n        val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }\n        BitmapFactory.decodeFile(file.absolutePath, options)\n        val width = options.outWidth.takeIf { it > 0 } ?: 1\n        val height = options.outHeight.takeIf { it > 0 } ?: 1\n        width to height\n    }\n    var quarterTurns by remember(file.absolutePath) { mutableIntStateOf(0) }\n    var zoom by remember(file.absolutePath) { mutableFloatStateOf(1f) }\n    var pan by remember(file.absolutePath) { mutableStateOf(Offset.Zero) }\n    var swipeAccum by remember(file.absolutePath) { mutableStateOf(Offset.Zero) }\n    var editing by remember(file.absolutePath) { mutableStateOf(false) }\n    var editRevision by remember(file.absolutePath) { mutableIntStateOf(0) }\n\n    fun resetView() { zoom = 1f; pan = Offset.Zero; swipeAccum = Offset.Zero }\n    fun rotateBy(turns: Int) { quarterTurns = (quarterTurns + turns).mod(4); resetView() }\n    fun moveGallery(delta: Int) {\n        if (files.size <= 1) return\n        currentIndex = (currentIndex + delta + files.size) % files.size\n        quarterTurns = 0\n        resetView()\n    }\n\n    Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {\n        BoxWithConstraints(\n            modifier = Modifier\n                .fillMaxSize()\n                .background(Color.Black)\n                .pointerInput(file.absolutePath, quarterTurns, currentIndex) {\n                    detectTransformGestures { _, drag, gestureZoom, _ ->\n                        val nextZoom = (zoom * gestureZoom).coerceIn(1f, 6f)\n                        zoom = nextZoom\n                        if (nextZoom <= 1.001f) {\n                            pan = Offset.Zero\n                            swipeAccum += drag\n                            val x = swipeAccum.x\n                            val y = swipeAccum.y\n                            if (kotlin.math.abs(x) > 120f || kotlin.math.abs(y) > 120f) {\n                                if (kotlin.math.abs(x) >= kotlin.math.abs(y)) moveGallery(if (x < 0f) 1 else -1)\n                                else moveGallery(if (y < 0f) 1 else -1)\n                                swipeAccum = Offset.Zero\n                            }\n                        } else {\n                            pan += drag\n                        }\n                    }\n                }\n                .pointerInput(file.absolutePath, quarterTurns) { detectTapGestures(onDoubleTap = { resetView() }) },\n            contentAlignment = Alignment.Center,\n        ) {\n            val sourceWidth = sourceSize.first.toFloat()\n            val sourceHeight = sourceSize.second.toFloat()\n            val rotated = quarterTurns % 2 != 0\n            val fittedWidthSource = if (rotated) sourceHeight else sourceWidth\n            val fittedHeightSource = if (rotated) sourceWidth else sourceHeight\n            val fit = minOf(maxWidth.value / fittedWidthSource, maxHeight.value / fittedHeightSource)\n            val imageWidth = (sourceWidth * fit).dp\n            val imageHeight = (sourceHeight * fit).dp\n\n            key(file.absolutePath, editRevision) {\n                AsyncImage(\n                    model = file,\n                    contentDescription = "高清原图",\n                    modifier = Modifier.size(imageWidth, imageHeight).graphicsLayer {\n                        rotationZ = quarterTurns * 90f\n                        scaleX = zoom\n                        scaleY = zoom\n                        translationX = pan.x\n                        translationY = pan.y\n                    },\n                    contentScale = ContentScale.FillBounds,\n                )\n            }\n\n            FilledIconButton(\n                onClick = onDismiss,\n                modifier = Modifier.align(Alignment.TopEnd).statusBarsPadding().padding(16.dp),\n                colors = IconButtonDefaults.filledIconButtonColors(containerColor = Color(0xAA2A2A2A), contentColor = Color.White),\n            ) { Icon(Icons.Default.Close, contentDescription = "关闭高清原图") }\n\n            if (files.size > 1) {\n                Surface(\n                    modifier = Modifier.align(Alignment.TopCenter).statusBarsPadding().padding(top = 18.dp),\n                    color = Color(0x99222222),\n                    contentColor = Color.White,\n                    shape = MaterialTheme.shapes.large,\n                ) { Text("${currentIndex + 1} / ${files.size} · 左右或上下滑动", modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp)) }\n            }\n\n            Surface(\n                modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth()\n                    .windowInsetsPadding(WindowInsets.safeDrawing.only(WindowInsetsSides.Bottom))\n                    .padding(start = 12.dp, end = 12.dp, bottom = 48.dp),\n                color = Color(0xCC222222), contentColor = Color.White, shape = MaterialTheme.shapes.extraLarge,\n            ) {\n                Column(Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 6.dp), verticalArrangement = Arrangement.spacedBy(2.dp)) {\n                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {\n                        TextButton(modifier = Modifier.weight(1f), onClick = { rotateBy(-1) }) { Icon(Icons.Default.RotateLeft, null); Spacer(Modifier.width(4.dp)); Text("左转", color = Color.White) }\n                        TextButton(modifier = Modifier.weight(1f), onClick = { rotateBy(1) }) { Icon(Icons.Default.RotateRight, null); Spacer(Modifier.width(4.dp)); Text("右转", color = Color.White) }\n                    }\n                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {\n                        TextButton(modifier = Modifier.weight(1f), onClick = { resetView() }) { Text("适应", color = Color.White) }\n                        TextButton(modifier = Modifier.weight(1f), onClick = { quarterTurns = 0; resetView() }) { Text("重置", color = Color.White) }\n                        TextButton(modifier = Modifier.weight(1f), onClick = { editing = true }) { Icon(Icons.Default.Edit, null); Spacer(Modifier.width(4.dp)); Text("编辑", color = Color.White) }\n                    }\n                    if (files.size > 1) {\n                        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(4.dp)) {\n                            TextButton(modifier = Modifier.weight(1f), onClick = { moveGallery(-1) }) { Text("上一张", color = Color.White) }\n                            TextButton(modifier = Modifier.weight(1f), onClick = { moveGallery(1) }) { Text("下一张", color = Color.White) }\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    if (editing) {\n        NoteImageEditorDialog(\n            file = file,\n            onDismiss = { editing = false },\n            onSaved = { editRevision += 1; resetView() },\n        )\n    }\n}\n'''
          text = text[:start] + tail
          editor.write_text(text, encoding='utf-8')

          # Version bump and release notes.
          replace_once(
              'app/build.gradle.kts',
              '''        versionCode = 43\n        versionName = "0.27.1"\n''',
              '''        versionCode = 44\n        versionName = "0.28.0"\n'''
          )
          wf = Path('.github/workflows/android.yml')
          text = wf.read_text(encoding='utf-8')
          marker = '"notes": "'
          pos = text.find(marker)
          if pos < 0: raise SystemExit('release notes marker not found')
          end = text.find('"', pos + len(marker))
          notes = '新增笔记媒体能力：全文搜索沿用已合入 main 的完整正文搜索；多图支持调整顺序并持久保存；点任意图片进入整篇笔记图库，可左右或上下滑动查看其他图片；已有图片可直接裁剪、画笔涂画、马赛克和添加文字；笔记新增创建时间并区分最后修改时间。数据库仅做向前兼容迁移，旧笔记用原更新时间回填创建时间，现有笔记、图片、类目、置顶与备份数据保持兼容。'
          text = text[:pos+len(marker)] + notes + text[end:]
          wf.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/menter/treatmentvault/data/CategoryModels.kt \
                  app/src/main/java/com/menter/treatmentvault/data/AppDatabase.kt \
                  app/src/main/java/com/menter/treatmentvault/backup/BackupManager.kt \
                  app/src/main/java/com/menter/treatmentvault/ui/screens/NotesScreen.kt \
                  app/src/main/java/com/menter/treatmentvault/ui/screens/NoteImageGrid.kt \
                  app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt \
                  app/build.gradle.kts .github/workflows/android.yml
          git commit -m "Add note media editing, gallery, ordering and timestamps for 0.28.0"
          git push origin HEAD:feature/note-media-v0280
