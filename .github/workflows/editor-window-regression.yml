name: Editor window regression
on:
  workflow_dispatch:
  push:
    branches: [fix/editor-resume-cursor]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Prepare test device
        run: |
          base64 --decode .github/keystore/treatmentvault-debug.keystore.b64 > .github/keystore/treatmentvault-debug.keystore
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile and run unit tests
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Check editor window on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            adb shell wm size 702x1536
            adb shell wm density 320
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash scripts/test-editor-window.sh
      - name: Collect results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-window-regression-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            keyboard-diagnostics
