name: Apply confirmed UI fixes
on:
  push:
    paths:
      - '.github/workflows/one-shot-batch-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch confirmed UI behavior
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # 1) Home quick actions: icon-only compact row; Manage enters real selection mode.
          home = 'app/src/main/java/com/menter/treatmentvault/ui/screens/HomeScreen.kt'
          replace(home, '''                        Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                FilledTonalButton(onClick = { go("note/new/inbox") }, modifier = Modifier.weight(1f)) { Icon(Icons.Default.EditNote, null); Spacer(Modifier.width(6.dp)); Text("新建记录") }
                                FilledTonalButton(onClick = { go("smart_input") }, modifier = Modifier.weight(1f)) { Icon(Icons.Default.Mic, null); Spacer(Modifier.width(6.dp)); Text("智能录入") }
                            }
                            FilledTonalButton(
                                onClick = { go("floating_audio") },
                                modifier = Modifier.fillMaxWidth(),
                            ) {
                                Icon(Icons.Default.GraphicEq, contentDescription = null)
                                Spacer(Modifier.width(8.dp))
                                Text("悬浮录音 · 进入录音板块")
                            }
''', '''                        Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                            Row(
                                Modifier.fillMaxWidth(),
                                horizontalArrangement = Arrangement.SpaceEvenly,
                                verticalAlignment = Alignment.CenterVertically,
                            ) {
                                FilledTonalIconButton(onClick = { go("note/new/inbox") }) { Icon(Icons.Default.EditNote, contentDescription = "新建记录") }
                                FilledTonalIconButton(onClick = { go("smart_input") }) { Icon(Icons.Default.Mic, contentDescription = "智能录入") }
                                FilledTonalIconButton(onClick = { go("floating_audio") }) { Icon(Icons.Default.GraphicEq, contentDescription = "悬浮录音") }
                            }
''')
          replace(home, 'TextButton(onClick = { go("notes") }) { Text("管理") }', 'TextButton(onClick = { go("notes/manage") }) { Text("管理") }')

          # 2) Navigation route for explicit batch-management mode.
          app = 'app/src/main/java/com/menter/treatmentvault/ui/App.kt'
          replace(app, 'composable("notes") { AllRecordsScreen(back = { nav.popBackStack() }, go = { nav.navigate(it) }) }', 'composable("notes") { AllRecordsScreen(back = { nav.popBackStack() }, go = { nav.navigate(it) }) }\n            composable("notes/manage") { AllRecordsScreen(back = { nav.popBackStack() }, go = { nav.navigate(it) }, startInManageMode = true) }')

          # 3) All-records batch management: checkboxes, select-all, move, add-to-folder, delete.
          ar = 'app/src/main/java/com/menter/treatmentvault/ui/screens/AllRecordsScreen.kt'
          replace(ar, 'fun AllRecordsScreen(back: () -> Unit, go: (String) -> Unit) {', 'fun AllRecordsScreen(back: () -> Unit, go: (String) -> Unit, startInManageMode: Boolean = false) {')
          replace(ar, '''    var selectedKeys by remember { mutableStateOf<Set<String>>(emptySet()) }
    var moveKeys by remember { mutableStateOf<Set<String>>(emptySet()) }
    var ownershipItem by remember { mutableStateOf<UnifiedRecordItem?>(null) }
''', '''    var managementMode by rememberSaveable { mutableStateOf(startInManageMode) }
    var selectedKeys by remember { mutableStateOf<Set<String>>(emptySet()) }
    var moveKeys by remember { mutableStateOf<Set<String>>(emptySet()) }
    var addKeys by remember { mutableStateOf<Set<String>>(emptySet()) }
    var confirmBatchDelete by remember { mutableStateOf(false) }
    var ownershipItem by remember { mutableStateOf<UnifiedRecordItem?>(null) }
''')
          replace(ar, '''            if (selectedKeys.isNotEmpty()) {
                TopAppBar(
                    title = { Text("已选 ${selectedKeys.size} 条记录") },
                    navigationIcon = { IconButton(onClick = { selectedKeys = emptySet() }) { Icon(Icons.Default.Close, contentDescription = "取消选择") } },
                    actions = { IconButton(onClick = { moveKeys = selectedKeys }) { Icon(Icons.Default.FolderOpen, contentDescription = "移动到") } },
                )
''', '''            if (managementMode) {
                TopAppBar(
                    title = { Text("已选 ${selectedKeys.size} 条") },
                    navigationIcon = { IconButton(onClick = { managementMode = false; selectedKeys = emptySet() }) { Icon(Icons.Default.Close, contentDescription = "退出管理") } },
                    actions = {
                        IconButton(onClick = { selectedKeys = if (selectedKeys.size == filtered.size) emptySet() else filtered.map { it.key }.toSet() }) { Icon(Icons.Default.SelectAll, contentDescription = "全选") }
                        IconButton(onClick = { if (selectedKeys.isNotEmpty()) moveKeys = selectedKeys }, enabled = selectedKeys.isNotEmpty()) { Icon(Icons.Default.DriveFileMove, contentDescription = "移动到文件夹") }
                        IconButton(onClick = { if (selectedKeys.isNotEmpty()) addKeys = selectedKeys }, enabled = selectedKeys.isNotEmpty()) { Icon(Icons.Default.CreateNewFolder, contentDescription = "添加到文件夹") }
                        IconButton(onClick = { if (selectedKeys.isNotEmpty()) confirmBatchDelete = true }, enabled = selectedKeys.isNotEmpty()) { Icon(Icons.Default.DeleteOutline, contentDescription = "删除") }
                    },
                )
''')
          replace(ar, 'if (shelf != RecordShelf.TRASH && selectedKeys.isEmpty()) {', 'if (shelf != RecordShelf.TRASH && !managementMode) {')
          replace(ar, 'onClick = { shelfName = item.name; selectedKeys = emptySet() },', 'onClick = { shelfName = item.name; selectedKeys = emptySet() },')
          replace(ar, 'if (selectedKeys.isEmpty()) {\n                item { Text("${filtered.size} 条记录 · 长按可重命名并查看全部归属文件夹", style = MaterialTheme.typography.bodySmall) }\n            }', 'if (!managementMode) {\n                item { Text("${filtered.size} 条记录 · 长按可重命名并查看全部归属文件夹", style = MaterialTheme.typography.bodySmall) }\n            } else {\n                item { Text("点选记录后可移动、添加到文件夹或删除", style = MaterialTheme.typography.bodySmall) }\n            }')
          replace(ar, 'selectionMode = selectedKeys.isNotEmpty(),', 'selectionMode = managementMode,')
          replace(ar, 'onOpen = { if (selectedKeys.isNotEmpty()) toggle(item) else go(item.route) },', 'onOpen = { if (managementMode) toggle(item) else go(item.route) },')
          replace(ar, '''                        onLongPress = {
                            if (selectedKeys.isNotEmpty() && shelf != RecordShelf.TRASH) toggle(item)
                            else ownershipItem = item
                        },
''', '''                        onLongPress = {
                            if (managementMode && shelf != RecordShelf.TRASH) toggle(item)
                            else ownershipItem = item
                        },
''')
          marker = '''    if (moveKeys.isNotEmpty()) {
        MoveRecordsDialog(
'''
          insert = '''    if (addKeys.isNotEmpty()) {
        AddRecordsToFoldersDialog(
            categories = categories,
            count = addKeys.size,
            onDismiss = { addKeys = emptySet() },
            onAdd = { destinations ->
                scope.launch {
                    allItems.filter { it.key in addKeys }.forEach { item ->
                        setUnifiedRecordFolders(dao, item, item.folderKeys + destinations)
                    }
                    selectedKeys = selectedKeys - addKeys
                    addKeys = emptySet()
                }
            },
        )
    }

    if (confirmBatchDelete) {
        AlertDialog(
            onDismissRequest = { confirmBatchDelete = false },
            title = { Text("删除 ${selectedKeys.size} 条记录？") },
            text = { Text("所选记录会移到回收站。") },
            confirmButton = {
                TextButton(onClick = {
                    val keys = selectedKeys
                    confirmBatchDelete = false
                    scope.launch {
                        allItems.filter { it.key in keys }.forEach { item ->
                            val state = recordStateFor(item, stateMap)
                            dao.saveRecordState(state.copy(trashedAt = System.currentTimeMillis(), archived = false, pinned = false, updatedAt = System.currentTimeMillis()))
                        }
                        selectedKeys = emptySet()
                    }
                }) { Text("删除") }
            },
            dismissButton = { TextButton(onClick = { confirmBatchDelete = false }) { Text("取消") } },
        )
    }

'''
          replace(ar, marker, insert + marker)
          marker2 = '''@OptIn(ExperimentalFoundationApi::class)
@Composable
private fun UnifiedRecordRow(
'''
          dialog = '''@Composable
private fun AddRecordsToFoldersDialog(
    categories: List<com.menter.treatmentvault.data.CategoryEntity>,
    count: Int,
    onDismiss: () -> Unit,
    onAdd: (Set<String>) -> Unit,
) {
    var selected by remember { mutableStateOf<Set<String>>(emptySet()) }
    val folders = categories.filterNot { it.hidden }.sortedBy { it.sortOrder }
    AlertDialog(
        onDismissRequest = onDismiss,
        title = { Text("添加 $count 条记录到文件夹") },
        text = {
            LazyColumn(modifier = Modifier.heightIn(max = 420.dp)) {
                items(folders, key = { it.key }) { folder ->
                    Row(
                        Modifier.fillMaxWidth().combinedClickable(
                            onClick = { selected = if (folder.key in selected) selected - folder.key else selected + folder.key },
                            onLongClick = {},
                        ).padding(vertical = 6.dp),
                        verticalAlignment = Alignment.CenterVertically,
                    ) {
                        Checkbox(
                            checked = folder.key in selected,
                            onCheckedChange = { checked -> selected = if (checked) selected + folder.key else selected - folder.key },
                        )
                        Spacer(Modifier.width(8.dp))
                        Icon(categoryIcon(folder.iconKey), contentDescription = null)
                        Spacer(Modifier.width(8.dp))
                        Text(folder.name)
                    }
                }
            }
        },
        confirmButton = { TextButton(onClick = { if (selected.isNotEmpty()) onAdd(selected) }, enabled = selected.isNotEmpty()) { Text("添加") } },
        dismissButton = { TextButton(onClick = onDismiss) { Text("取消") } },
    )
}

'''
          replace(ar, marker2, dialog + marker2)

          # 4) Blank-line action: keep the feature, move cursor/focus after the inserted two newlines.
          rg = 'app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt'
          replace(rg, 'import androidx.compose.ui.platform.LocalUriHandler\nimport androidx.compose.ui.text.style.TextOverflow', 'import androidx.compose.ui.platform.LocalUriHandler\nimport androidx.compose.ui.focus.FocusRequester\nimport androidx.compose.ui.focus.focusRequester\nimport androidx.compose.ui.text.TextRange\nimport androidx.compose.ui.text.input.TextFieldValue\nimport androidx.compose.ui.text.style.TextOverflow')
          replace(rg, '    var audioMenuExpanded by remember(ownerType, sessionKey) { mutableStateOf(false) }\n', '    var audioMenuExpanded by remember(ownerType, sessionKey) { mutableStateOf(false) }\n    var cursorRequestKey by remember(ownerType, sessionKey) { mutableStateOf<String?>(null) }\n')
          replace(rg, 'IconButton(onClick = { val i = currentIndexFor(block); if (i >= 0) { blocks[i] = block.copy(text = block.text + "\\n\\n"); sync() } }) { Icon(Icons.Default.KeyboardReturn, "空一行") }', 'IconButton(onClick = { val i = currentIndexFor(block); if (i >= 0) { blocks[i] = block.copy(text = block.text + "\\n\\n"); cursorRequestKey = block.key; sync() } }) { Icon(Icons.Default.KeyboardReturn, "空一行") }')
          old_editor = '''                                    BasicTextField(
                                        value = block.text,
                                        onValueChange = { next -> val liveIndex = currentIndexFor(block); if (liveIndex >= 0) { blocks[liveIndex] = block.copy(text = next); sync() } },
                                        modifier = Modifier.fillMaxWidth().defaultMinSize(minHeight = 112.dp).padding(horizontal = 2.dp, vertical = 10.dp),
                                        textStyle = MaterialTheme.typography.bodyLarge.copy(color = MaterialTheme.colorScheme.onSurface),
                                    )
'''
          new_editor = '''                                    val focusRequester = remember(block.key) { FocusRequester() }
                                    var fieldValue by remember(block.key) { mutableStateOf(TextFieldValue(block.text, TextRange(block.text.length))) }
                                    LaunchedEffect(block.text) {
                                        if (fieldValue.text != block.text) fieldValue = TextFieldValue(block.text, TextRange(block.text.length))
                                    }
                                    LaunchedEffect(cursorRequestKey) {
                                        if (cursorRequestKey == block.key) {
                                            fieldValue = TextFieldValue(block.text, TextRange(block.text.length))
                                            focusRequester.requestFocus()
                                            cursorRequestKey = null
                                        }
                                    }
                                    BasicTextField(
                                        value = fieldValue,
                                        onValueChange = { next ->
                                            fieldValue = next
                                            val liveIndex = currentIndexFor(block)
                                            if (liveIndex >= 0) { blocks[liveIndex] = block.copy(text = next.text); sync() }
                                        },
                                        modifier = Modifier.fillMaxWidth().focusRequester(focusRequester).defaultMinSize(minHeight = 112.dp).padding(horizontal = 2.dp, vertical = 10.dp),
                                        textStyle = MaterialTheme.typography.bodyLarge.copy(color = MaterialTheme.colorScheme.onSurface),
                                    )
'''
          replace(rg, old_editor, new_editor)

          # Version bump for a new in-app update.
          gradle = 'app/build.gradle.kts'
          replace(gradle, 'versionCode = 47', 'versionCode = 48')
          replace(gradle, 'versionName = "0.30.1"', 'versionName = "0.30.2"')

          # Remove this one-shot workflow from the resulting commit.
          Path('.github/workflows/one-shot-batch-ui.yml').unlink()
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add batch management and polish editor controls"
          git push origin main
