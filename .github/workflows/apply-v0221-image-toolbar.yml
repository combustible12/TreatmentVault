name: Apply TreatmentVault 0.22.1 image toolbar fix

on:
  push:
    paths:
      - '.github/workflows/apply-v0221-image-toolbar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore canonical signing key
        run: |
          base64 --decode .github/keystore/treatmentvault-debug.keystore.b64 > .github/keystore/treatmentvault-debug.keystore
          chmod 600 .github/keystore/treatmentvault-debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply responsive image toolbar fix
        run: python3 .github/scripts/patch_v0221_image_toolbar.py
      - name: Run regression tests and compile
        run: |
          gradle testDebugUnitTest --stacktrace
          gradle assembleDebug --stacktrace
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/menter/treatmentvault/ui/screens/Common.kt app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix image viewer toolbar overflow in 0.22.1"
          git push
