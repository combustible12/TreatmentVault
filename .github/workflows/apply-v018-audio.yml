name: Apply TreatmentVault 0.18.0 audio support

on:
  push:
    paths:
      - '.github/workflows/apply-v018-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply audio source changes
        run: python3 scripts/apply_v018_audio.py
      - name: Run regression tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "TreatmentVault 0.18.0: record import and play audio"
          git push origin HEAD:main
