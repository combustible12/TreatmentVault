name: Repair one-shot workflow
on:
  push:
    paths:
      - '.github/workflows/repair-one-shot.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and commit
        run: |
          sed -i 's/shell: python$/shell: python {0}/' .github/workflows/one-shot-batch-ui.yml
          rm .github/workflows/repair-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair UI patch workflow"
          git push origin main
