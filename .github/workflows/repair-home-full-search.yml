name: Repair Home Full Search

on:
  push:
    branches:
      - feature/note-media-v0280

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/note-media-v0280
          fetch-depth: 0
      - name: Restore complete HomeScreen and keep full-text search
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/src/main/java/com/menter/treatmentvault/ui/screens/HomeScreen.kt'
          git show 91972cb0baf6965a856332f46d80d98b99eb658a:$FILE > "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/HomeScreen.kt')
          text = p.read_text(encoding='utf-8')
          old = 'listOf(recordDisplayTitle(item, state), item.preview, item.section, item.date).any { it.contains(q, true) }'
          new = 'listOf(recordDisplayTitle(item, state), item.title, item.searchText, item.section, item.date).any { it.contains(q, true) }'
          if text.count(old) != 1:
              raise SystemExit(f'expected 1 search expression, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/menter/treatmentvault/ui/screens/HomeScreen.kt
          git commit -m "Restore HomeScreen while preserving full-text search"
          git push origin HEAD:feature/note-media-v0280
