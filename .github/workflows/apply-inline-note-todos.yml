name: Apply inline note todos

on:
  push:
    branches:
      - feature/inline-note-todos
    paths:
      - '.github/workflows/apply-inline-note-todos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore canonical signing key
        run: |
          base64 --decode .github/keystore/treatmentvault-debug.keystore.b64 > .github/keystore/treatmentvault-debug.keystore
          chmod 600 .github/keystore/treatmentvault-debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Wire inline todo editor into rich note text blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt')
          text = path.read_text(encoding='utf-8')

          old_help = '"文字、图片、录音和链接按当前顺序保存；连续放入 2 张及以上图片会自动变成宫格，点图片仍可查看高清原图。"'
          new_help = '"文字里可以直接混用普通行和待办行；勾选后只变灰并划线，不会删除。图片、录音和链接仍按当前顺序保存；连续 2 张及以上图片自动变成宫格。"'
          if old_help in text:
              text = text.replace(old_help, new_help, 1)
          elif new_help not in text:
              raise SystemExit('Help text target not found')

          anchor = 'placeholder = { Text(if (blockIndex == 0) "直接写内容或粘贴链接…" else "继续写…") },'
          anchor_index = text.find(anchor)
          if anchor_index < 0:
              if 'InlineTodoTextEditor(' in text:
                  path.write_text(text, encoding='utf-8')
                  raise SystemExit(0)
              raise SystemExit('Text editor anchor not found')

          start = text.rfind('OutlinedTextField(', 0, anchor_index)
          if start < 0:
              raise SystemExit('OutlinedTextField start not found')
          line_start = text.rfind('\n', 0, start) + 1
          indent = text[line_start:start]

          min_lines = text.find('minLines = 3,', anchor_index)
          if min_lines < 0:
              raise SystemExit('Text editor end anchor not found')
          closing = text.find('\n' + indent + ')', min_lines)
          if closing < 0:
              raise SystemExit('Text editor closing parenthesis not found')
          end = closing + len('\n' + indent + ')')

          inner = indent + '    '
          new_editor = (
              indent + 'InlineTodoTextEditor(\n'
              + inner + 'value = block.text,\n'
              + inner + 'onValueChange = { next ->\n'
              + inner + '    val liveIndex = currentIndexFor(block)\n'
              + inner + '    if (liveIndex >= 0) {\n'
              + inner + '        blocks[liveIndex] = block.copy(text = next)\n'
              + inner + '        sync()\n'
              + inner + '    }\n'
              + inner + '},\n'
              + inner + 'placeholder = if (blockIndex == 0) "直接写内容、待办或粘贴链接…" else "继续写…",\n'
              + indent + ')'
          )
          text = text[:start] + new_editor + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run regression tests and build APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/menter/treatmentvault/ui/screens/RichNoteGridEditor.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add inline checklist rows to note text blocks"
          git push origin HEAD:${GITHUB_REF_NAME}
