name: Recording appearance regression
on:
  workflow_dispatch:
  push:

jobs:
  recording-ui:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Check recording UI:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Prepare test device
        run: |
          base64 --decode .github/keystore/treatmentvault-debug.keystore.b64 > .github/keystore/treatmentvault-debug.keystore
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile recording UI test
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Check recording appearance and controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 702x1536
            adb shell wm density 320
            bash -c 'set +e; gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.menter.treatmentvault.RecordingAppearanceTest --stacktrace; test_status=$?; mkdir -p recording-appearance; adb pull /sdcard/Download/recording-appearance recording-appearance/; adb logcat -d > recording-appearance/logcat.txt; exit "$test_status"'
      - name: Collect recording UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-appearance-api35
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            recording-appearance
