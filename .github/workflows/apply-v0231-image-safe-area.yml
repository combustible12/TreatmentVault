name: Apply 0.23.1 Image Viewer Safe Area

on:
  push:
    branches:
      - fix/image-viewer-bottom-safe-area-0.23.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-viewer-bottom-safe-area-0.23.1
      - name: Apply safe-area patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/src/main/java/com/menter/treatmentvault/ui/screens/Common.kt',
              '''                    .fillMaxWidth()\n                    .navigationBarsPadding()\n                    .padding(start = 12.dp, end = 12.dp, bottom = 20.dp),\n''',
              '''                    .fillMaxWidth()\n                    .windowInsetsPadding(WindowInsets.safeDrawing.only(WindowInsetsSides.Bottom))\n                    .padding(start = 12.dp, end = 12.dp, bottom = 48.dp),\n'''
          )

          replace_once(
              'app/build.gradle.kts',
              '''        versionCode = 36\n        versionName = "0.23.0"\n''',
              '''        versionCode = 37\n        versionName = "0.23.1"\n'''
          )
          PY

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/menter/treatmentvault/ui/screens/Common.kt app/build.gradle.kts
          git commit -m "Fix image viewer bottom safe area in 0.23.1"
          git push origin HEAD:fix/image-viewer-bottom-safe-area-0.23.1
