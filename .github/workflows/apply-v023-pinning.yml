name: Apply 0.23.0 Pinning

on:
  push:
    branches:
      - feature/pinning-0.23.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pinning-0.23.0
      - name: Apply pinning patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/src/main/java/com/menter/treatmentvault/ui/screens/HomeScreen.kt',
              '''                        DropdownMenuItem(\n                            text = { Text(if (isTodo(state)) "切换为普通条目" else "切换为待办事项") },\n                            leadingIcon = { Icon(if (isTodo(state)) Icons.Default.Notes else Icons.Default.CheckBox, contentDescription = null) },\n                            onClick = { menuOpen = false; onStateChange(toggleTodoDisplay(state)) },\n                        )\n''',
              '''                        DropdownMenuItem(\n                            text = { Text(if (isTodo(state)) "切换为普通条目" else "切换为待办事项") },\n                            leadingIcon = { Icon(if (isTodo(state)) Icons.Default.Notes else Icons.Default.CheckBox, contentDescription = null) },\n                            onClick = { menuOpen = false; onStateChange(toggleTodoDisplay(state)) },\n                        )\n                        DropdownMenuItem(\n                            text = { Text(if (state.pinned) "取消置顶" else "置顶") },\n                            leadingIcon = { Icon(Icons.Default.PushPin, contentDescription = null) },\n                            onClick = { menuOpen = false; onStateChange(state.copy(pinned = !state.pinned)) },\n                        )\n'''
          )

          replace_once(
              'app/src/main/java/com/menter/treatmentvault/ui/screens/FolderScreen.kt',
              '''    val directItems = remember(activeItems, categoryId) {\n        activeItems.filter { categoryId in it.folderKeys }\n            .sortedWith(compareByDescending<UnifiedRecordItem> { isTodo(recordStateFor(it, stateMap)) && !recordStateFor(it, stateMap).completed }.thenByDescending { it.updatedAt })\n    }\n''',
              '''    val directItems = remember(activeItems, stateMap, categoryId) {\n        activeItems.filter { categoryId in it.folderKeys }\n            .sortedWith(\n                compareByDescending<UnifiedRecordItem> { recordStateFor(it, stateMap).pinned }\n                    .thenByDescending { isTodo(recordStateFor(it, stateMap)) && !recordStateFor(it, stateMap).completed }\n                    .thenByDescending { it.updatedAt }\n            )\n    }\n'''
          )

          replace_once(
              'app/src/main/java/com/menter/treatmentvault/ui/screens/FolderScreen.kt',
              '''                        DropdownMenuItem(\n                            text = { Text(if (isTodo(state)) "切换为普通条目" else "切换为待办事项") },\n                            leadingIcon = { Icon(if (isTodo(state)) Icons.Default.Notes else Icons.Default.CheckBox, contentDescription = null) },\n                            onClick = { menuOpen = false; onStateChange(toggleTodoDisplay(state)) },\n                        )\n''',
              '''                        DropdownMenuItem(\n                            text = { Text(if (isTodo(state)) "切换为普通条目" else "切换为待办事项") },\n                            leadingIcon = { Icon(if (isTodo(state)) Icons.Default.Notes else Icons.Default.CheckBox, contentDescription = null) },\n                            onClick = { menuOpen = false; onStateChange(toggleTodoDisplay(state)) },\n                        )\n                        DropdownMenuItem(\n                            text = { Text(if (state.pinned) "取消置顶" else "置顶") },\n                            leadingIcon = { Icon(Icons.Default.PushPin, contentDescription = null) },\n                            onClick = { menuOpen = false; onStateChange(state.copy(pinned = !state.pinned)) },\n                        )\n'''
          )

          replace_once(
              'app/src/main/java/com/menter/treatmentvault/ui/screens/RecordFolderUi.kt',
              '''import androidx.compose.foundation.lazy.items\nimport androidx.compose.material3.*\n''',
              '''import androidx.compose.foundation.lazy.items\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.PushPin\nimport androidx.compose.material3.*\n'''
          )

          replace_once(
              'app/src/main/java/com/menter/treatmentvault/ui/screens/RecordFolderUi.kt',
              '''                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                        TextButton(\n                            onClick = { renameText = displayTitle; renaming = true },\n                            modifier = Modifier.weight(1f),\n                        ) { Text("重命名") }\n                        if (onFoldersChange != null) {\n                            TextButton(onClick = { managing = true }, modifier = Modifier.weight(1f)) {\n                                Text("管理归属")\n                            }\n                        }\n                    }\n''',
              '''                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                        TextButton(\n                            onClick = { renameText = displayTitle; renaming = true },\n                            modifier = Modifier.weight(1f),\n                        ) { Text("重命名") }\n                        if (onFoldersChange != null) {\n                            TextButton(onClick = { managing = true }, modifier = Modifier.weight(1f)) {\n                                Text("管理归属")\n                            }\n                        }\n                    }\n                    currentState?.let { state ->\n                        FilledTonalButton(\n                            onClick = {\n                                val next = state.copy(\n                                    pinned = !state.pinned,\n                                    updatedAt = System.currentTimeMillis(),\n                                )\n                                scope.launch {\n                                    dao.saveRecordState(next)\n                                    currentState = next\n                                }\n                            },\n                            modifier = Modifier.fillMaxWidth(),\n                        ) {\n                            Icon(Icons.Default.PushPin, contentDescription = null)\n                            Spacer(Modifier.width(6.dp))\n                            Text(if (state.pinned) "取消置顶" else "置顶")\n                        }\n                    }\n'''
          )

          replace_once(
              'app/build.gradle.kts',
              '''        versionCode = 35\n        versionName = "0.22.1"\n''',
              '''        versionCode = 36\n        versionName = "0.23.0"\n'''
          )
          PY

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/menter/treatmentvault/ui/screens/HomeScreen.kt \
                  app/src/main/java/com/menter/treatmentvault/ui/screens/FolderScreen.kt \
                  app/src/main/java/com/menter/treatmentvault/ui/screens/RecordFolderUi.kt \
                  app/build.gradle.kts
          git commit -m "Add record pinning controls for 0.23.0"
          git push origin HEAD:feature/pinning-0.23.0
